name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Required at build time to avoid missing env errors
          GEMINI_API_KEY: placeholder
          RESEND_API_KEY: placeholder
          TURNSTILE_SECRET_KEY: placeholder
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: placeholder
          UPSTASH_REDIS_REST_URL: https://placeholder.upstash.io
          UPSTASH_REDIS_REST_TOKEN: placeholder
          OWNER_EMAIL: placeholder@example.com
          NEXT_PUBLIC_SITE_URL: https://rohailrahmat.dev
